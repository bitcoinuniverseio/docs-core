name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # This workflow runs only for trusted pushes to main or a maintainer
    # dispatch, never for a fork pull request, so the organization-owned Linux
    # fleet is the right place for it.
    runs-on: [self-hosted, Linux, X64, universe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main

      - name: Gates that must hold on the deployed commit
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to the gh-pages branch
        # Branch publishing keeps the site out of Actions artifact storage,
        # which the Free plan shares with private packages and is full.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Publish ${GITHUB_SHA}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push -qf "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

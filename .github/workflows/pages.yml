name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # This workflow runs only for trusted pushes to main or a maintainer
    # dispatch, never for a fork pull request, so the organization-owned Linux
    # fleet is the right place for it.
    runs-on: [self-hosted, linux-ultra]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main

      - name: Install
        run: npm ci

      - name: Gates that must hold on the deployed commit
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: [self-hosted, linux-ultra]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Docs

# Pull requests only, plus a manual trigger.
#
# This job ends with a full axe audit of every built page in both themes at two
# widths, which takes roughly forty minutes on the shared fleet. Running it
# again on the push that merges the same commit doubled that cost for no extra
# signal, and the Pages workflow already re-runs every gate on the exact commit
# it deploys. Branch protection evaluates the pull request head, which this
# still covers.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This exact job name is the required status check on main. Renaming it
    # would leave branch protection waiting forever for a check nothing reports.
    name: Check published pages
    # This repository is public, so `route.yml` in the private `.github-private`
    # is unreachable from here: a public repository cannot resolve a reusable
    # workflow from a private one. `universe-ci-actions` below is public and is
    # fine to call.
    runs-on: [self-hosted, linux-ultra]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main

      # One command per step. A shell reports only the exit code of the last
      # command in a chained run block, so a chained first command fails in
      # silence and the gate stops being a gate.
      - name: Copy rules (no em dash, no banned word, no unsupported claim)
        run: npm run check:copy

      - name: Public-safety scan (private hosts, IPs, credential shapes)
        run: npm run check:public-safety

      - name: Documentation manifest validates against the platform schema
        run: npm run check:manifest

      - name: OpenAPI document parses, and describes read operations only
        run: npm run check:openapi

      - name: Protocol pages match the pinned registry snapshot
        run: npm run check:registry

      - name: No image over 200 KB, and no orphan screenshot
        run: npm run check:assets

      - name: Markdown lint
        run: npm run check:markdown

      - name: Build (validates every internal link and anchor)
        run: npm run build

      - name: Search index exists
        run: test -f dist/pagefind/pagefind.js

      - name: Sitemap index, shards and /sitemap.xml are all present and absolute
        run: npm run check:sitemap

      - name: Machine-readable files exist
        run: test -f dist/llms.txt && test -f dist/robots.txt && test -f dist/openapi/core-public-read.json

      - name: Install a browser for the accessibility audit
        # The certified runner already owns its system browser dependencies.
        # Install the pinned browser as the service user; `--with-deps` would
        # request sudo and fail correctly on the non-privileged runner account.
        run: npx playwright install chromium

      - name: Serve the built site
        run: npx astro preview --port 4323 &

      - name: Accessibility and horizontal overflow, every page, both themes
        run: npx wait-on http://localhost:4323/docs-core/ && npm run check:a11y

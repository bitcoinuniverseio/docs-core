name: Docs

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repository is public and `route.yml` lives in the private
  # `.github-private`. A public repository cannot resolve a reusable workflow
  # from a private one, so every run since the router landed ended as a
  # 0-second failure with no jobs created, on `develop`, on `main` and on pull
  # requests. The documentation gate has not run at all in that window.
  #
  # `universe-ci-actions` below is fine to keep: that repository is public, so
  # a public caller can reach it.
  #
  # Nothing about the routing layer is wrong for the private repositories it
  # was built for. Restore it here only if `route.yml` is published somewhere a
  # public caller can reach.
  check:
    name: Check published pages
    runs-on: [self-hosted, linux-ultra]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main
      # One command per step. A shell reports only the exit code of the last
      # command in a chained run block, so a chained first command fails in
      # silence and the gate stops being a gate.
      - name: Test the documentation checker
        run: node --test scripts/check-docs.test.cjs

      - name: Check published pages
        run: node scripts/check-docs.cjs

name: Docs

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    uses: bitcoinuniverseio/.github-private/.github/workflows/route.yml@develop
    secrets: inherit
    with:
      plan: '{"check_2":"light"}'

  check:
    needs: route
    name: Check published pages
    runs-on: ${{ fromJSON(needs.route.outputs.targets).check_2 }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main
      # One command per step. A shell reports only the exit code of the last
      # command in a chained run block, so a chained first command fails in
      # silence and the gate stops being a gate.
      - name: Test the documentation checker
        run: node --test scripts/check-docs.test.cjs

      - name: Check published pages
        run: node scripts/check-docs.cjs

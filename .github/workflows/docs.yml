name: Docs

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check published pages
    runs-on: [self-hosted, Linux, universe-ci]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # One command per step. A shell reports only the exit code of the last
      # command in a chained run block, so a chained first command fails in
      # silence and the gate stops being a gate.
      - name: Test the documentation checker
        run: node --test scripts/check-docs.test.cjs

      - name: Check published pages
        run: node scripts/check-docs.cjs

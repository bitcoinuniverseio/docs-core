<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 268" width="1200" height="268" role="img" aria-label="Bitcoin Universe: Bitcoin and Dogecoin metaprotocols in one place, with the source behind every number">
  <defs>
    <style>
      .bg { fill: #faf9f7; }
      .rule { stroke: #e3e1dc; stroke-width: 1; }
      .cell { fill: none; stroke: #e0ded8; stroke-width: 1; }
      .cell-filled { fill: #efedea; stroke: #d9d6cf; stroke-width: 1; }
      .sat { fill: #f7931a; }
      .wordmark { fill: #1a1b1e; font-family: Inter, "Segoe UI", system-ui, sans-serif; font-weight: 700; }
      .accentword { fill: #c2410c; }
      .lede { fill: #565b63; font-family: Inter, "Segoe UI", system-ui, sans-serif; font-weight: 400; }
      .tick { fill: #6a7078; font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 400; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="268"/>

  <!-- Ledger rules: the flat, ordered baseline the whole identity sits on. -->
  <line class="rule" x1="72" y1="70" x2="1128" y2="70"/>
  <line class="rule" x1="72" y1="222" x2="1128" y2="222"/>

  <text class="tick" x="72" y="56" font-size="13">BLOCK</text>
  <text class="tick" x="1128" y="56" font-size="13" text-anchor="end">SAT COORDINATE</text>

  <!-- Three blocks of sixteen cells, receding into chain depth. One cell
       carries an ordinal: the product exists because a single sat inside a
       single block can be located, read, and traded. -->
  <g transform="translate(72,106)">
    <g>
      <rect class="cell-filled" x="0" y="0" width="22" height="22"/><rect class="cell" x="24" y="0" width="22" height="22"/><rect class="cell" x="48" y="0" width="22" height="22"/><rect class="cell-filled" x="72" y="0" width="22" height="22"/>
      <rect class="cell" x="0" y="24" width="22" height="22"/><rect class="cell-filled" x="24" y="24" width="22" height="22"/><rect class="cell" x="48" y="24" width="22" height="22"/><rect class="cell" x="72" y="24" width="22" height="22"/>
      <rect class="cell" x="0" y="48" width="22" height="22"/><rect class="cell" x="24" y="48" width="22" height="22"/><rect class="sat" x="48" y="48" width="22" height="22"/><rect class="cell" x="72" y="48" width="22" height="22"/>
      <rect class="cell-filled" x="0" y="72" width="22" height="22"/><rect class="cell" x="24" y="72" width="22" height="22"/><rect class="cell" x="48" y="72" width="22" height="22"/><rect class="cell-filled" x="72" y="72" width="22" height="22"/>
    </g>
    <g transform="translate(118,0)" opacity="0.72">
      <rect class="cell" x="0" y="0" width="22" height="22"/><rect class="cell-filled" x="24" y="0" width="22" height="22"/><rect class="cell" x="48" y="0" width="22" height="22"/><rect class="cell" x="72" y="0" width="22" height="22"/>
      <rect class="cell" x="0" y="24" width="22" height="22"/><rect class="cell" x="24" y="24" width="22" height="22"/><rect class="cell-filled" x="48" y="24" width="22" height="22"/><rect class="cell" x="72" y="24" width="22" height="22"/>
      <rect class="cell-filled" x="0" y="48" width="22" height="22"/><rect class="cell" x="24" y="48" width="22" height="22"/><rect class="cell" x="48" y="48" width="22" height="22"/><rect class="cell" x="72" y="48" width="22" height="22"/>
      <rect class="cell" x="0" y="72" width="22" height="22"/><rect class="cell" x="24" y="72" width="22" height="22"/><rect class="cell" x="48" y="72" width="22" height="22"/><rect class="cell-filled" x="72" y="72" width="22" height="22"/>
    </g>
    <g transform="translate(236,0)" opacity="0.46">
      <rect class="cell" x="0" y="0" width="22" height="22"/><rect class="cell" x="24" y="0" width="22" height="22"/><rect class="cell-filled" x="48" y="0" width="22" height="22"/><rect class="cell" x="72" y="0" width="22" height="22"/>
      <rect class="cell-filled" x="0" y="24" width="22" height="22"/><rect class="cell" x="24" y="24" width="22" height="22"/><rect class="cell" x="48" y="24" width="22" height="22"/><rect class="cell" x="72" y="24" width="22" height="22"/>
      <rect class="cell" x="0" y="48" width="22" height="22"/><rect class="cell" x="24" y="48" width="22" height="22"/><rect class="cell" x="48" y="48" width="22" height="22"/><rect class="cell-filled" x="72" y="48" width="22" height="22"/>
      <rect class="cell" x="0" y="72" width="22" height="22"/><rect class="cell-filled" x="24" y="72" width="22" height="22"/><rect class="cell" x="48" y="72" width="22" height="22"/><rect class="cell" x="72" y="72" width="22" height="22"/>
    </g>
  </g>

  <text class="wordmark" x="452" y="142" font-size="52" letter-spacing="-1.5">Bitcoin <tspan class="accentword">Universe</tspan></text>
  <text class="lede" x="454" y="180" font-size="20">Bitcoin and Dogecoin metaprotocols in one place,</text>
  <text class="lede" x="454" y="208" font-size="20">with the source behind every number.</text>
</svg>
